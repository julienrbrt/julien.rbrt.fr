name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
permissions:
  contents: write
env:
  GOOS: js
  GOARCH: wasm
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set up Go 📦
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Install and Build 🔧
        run: |
          go build -o public/main.wasm ./cmd/render

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: public
